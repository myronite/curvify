name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile library targets
        run: >
          ./gradlew
          :curvify:compileKotlinJvm
          :curvify:compileKotlinJs
          :curvify:compileKotlinWasmJs
          :curvify:compileKotlinIosX64
          :curvify:compileKotlinIosArm64
          :curvify:compileKotlinIosSimulatorArm64
